name: 공시 목록 HTTP 부하 시험

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'tools/bench-disclosures.mjs'
      - '.github/workflows/disclosure-load.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 공시 테스트 및 서버 빌드
        run: bash gradlew -p backend test installDist
      - name: 모의 공시 3541건으로 로컬 HTTP 측정
        shell: bash
        run: |
          export DART_ARCHIVE_DIR="$RUNNER_TEMP/bench-disclosures"
          mkdir -p "$DART_ARCHIVE_DIR"
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const items = Array.from({length: 3541}, (_, i) => ({
            receiptNo: '20261128' + String(i + 1).padStart(6, '0'), filedOn: '2026-11-28',
            stockCode: '005930', companyName: '시험회사', reporterName: '시험보고자', position: null,
            isCorrection: false, holdingDeltaShares: 5, direction: 'INCREASE', tradeRowCount: 1,
            tradePreview: [{rowNo: 1, reason: '장내매수', changedOn: '2026-11-27', deltaShares: 5, unitPriceKrw: 1000}],
          }));
          writeFileSync(process.env.DART_ARCHIVE_DIR + '/disclosures.json', JSON.stringify({
            from: '2026-08-31', to: '2026-11-28', issuers: {'005930': '00126380'}, items,
          }));
          JS
          backend/build/install/stocktrace-backend/bin/stocktrace-backend &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 15 --retry-connrefused --retry-delay 1 \
            'http://127.0.0.1:8080/api/v1/disclosures?limit=2' --output /dev/null
          node tools/bench-disclosures.mjs | tee -a "$GITHUB_STEP_SUMMARY"
